<!doctype html>

<html lang="en">

<head>

    <meta charset="utf-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <title>
        {% block title %}
        FitBuddy
        {% endblock %}
    </title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', path='css/style.css') }}"
    >

</head>


<body>

<header class="topbar">

    <a
        class="brand"
        href="/"
    >
        FitBuddy<span>AI</span>
    </a>

    <nav>

        <a href="/">
            New Plan
        </a>

        <a href="/view-all-users">
            Admin
        </a>

        <a href="/docs">
            API Docs
        </a>

    </nav>

</header>


<main class="page">

    {% block content %}
    {% endblock %}

</main>


<footer>

    FitBuddy is a wellness planning demo.
    It does not replace professional medical,
    nutrition, or exercise advice.

</footer>

</body>

</html>
